[project]
name = "novelforge-backend"
version = "0.1.0"
description = "NovelForgeX AI Novel Writing Engine - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "chromadb>=0.5.0",
    "apscheduler>=3.10.0",
    "playwright>=1.48.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "jieba>=0.42.1",
    "ebooklib>=0.18",
    "python-docx>=1.1.0",
    "chardet>=5.2.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:jieba",
]

[tool.pytest-asyncio]
mode = "auto"
